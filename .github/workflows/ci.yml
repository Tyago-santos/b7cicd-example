name: CI
on:
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Instalar Node
        uses: actions/setup-node@v2
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Roda tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Instalar Node
        uses: actions/setup-node@v2
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Roda tests
        run: npm test
      - name: build
        run: npm run build
