name: CI/CD
on:
  pull_request:
    branches:
      - develop
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - develop

env:
  PORT: ${{ vars.PORT }}
  API_TOKEN: ${{ secrets.API_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Roda tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Build projeto
        run: npm run build

      - name: Deploy para Render
        uses: renderdeploy/action-deploy@v1
        with:
          render-deploy-token: ${{ secrets.RENDER_DEPLOY_TOKEN }}
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
